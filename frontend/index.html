```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>RA | Centro de Usinagem</title>

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="css/style.css">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

    <!-- HUD superior -->
    <header id="hud">

        <div class="hud-title">
            <strong>CENTRO DE USINAGEM</strong>
            <span>MANUAL INTERATIVO</span>
        </div>

        <div id="target-status" class="status">
            Aponte a câmera para o equipamento
        </div>

    </header>


    <!-- Área de informação -->
    <section id="info-panel" class="hidden">

        <div class="info-card">

            <button
                id="close-panel"
                class="close-button"
                type="button"
                aria-label="Fechar informações"
            >
                ×
            </button>

            <h2 id="info-title">Informações</h2>

            <div id="info-content">
                Aponte a câmera para o Centro de Usinagem e selecione um ponto.
            </div>

        </div>

    </section>


    <!-- Mensagem de conexão -->
    <div id="connection-status" class="connection-status">
        Preparando realidade aumentada...
    </div>


    <!-- Cena WebAR -->
    <a-scene
        mindar-image="
            imageTargetSrc: assets/targets/centro-usinagem.mind;
            autoStart: true;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "
        embedded
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >

        <!-- Câmera -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>


        <!-- Target reconhecido -->
        <a-entity mindar-image-target="targetIndex: 0">


            <!-- ================================================= -->
            <!-- HOTSPOT 1 - PAINEL DE CONTROLE -->
            <!-- ================================================= -->

            <a-entity
                class="hotspot"
                data-topic="painel"
                position="-0.35 0.15 0"
                geometry="
                    primitive: circle;
                    radius: 0.055;
                "
                material="
                    color: #00e5ff;
                    shader: flat;
                    opacity: 0.95;
                "
            >

                <a-text
                    value="1"
                    align="center"
                    color="#ffffff"
                    width="1"
                    position="0 0 0.01"
                ></a-text>

            </a-entity>


            <!-- ================================================= -->
            <!-- HOTSPOT 2 - ÁREA DE USINAGEM -->
            <!-- ================================================= -->

            <a-entity
                class="hotspot"
                data-topic="usinagem"
                position="0.05 0.05 0"
                geometry="
                    primitive: circle;
                    radius: 0.055;
                "
                material="
                    color: #00e5ff;
                    shader: flat;
                    opacity: 0.95;
                "
            >

                <a-text
                    value="2"
                    align="center"
                    color="#ffffff"
                    width="1"
                    position="0 0 0.01"
                ></a-text>

            </a-entity>


            <!-- ================================================= -->
            <!-- HOTSPOT 3 - MAGAZINE DE FERRAMENTAS -->
            <!-- ================================================= -->

            <a-entity
                class="hotspot"
                data-topic="magazine"
                position="0.38 0.18 0"
                geometry="
                    primitive: circle;
                    radius: 0.055;
                "
                material="
                    color: #00e5ff;
                    shader: flat;
                    opacity: 0.95;
                "
            >

                <a-text
                    value="3"
                    align="center"
                    color="#ffffff"
                    width="1"
                    position="0 0 0.01"
                ></a-text>

            </a-entity>


            <!-- ================================================= -->
            <!-- HOTSPOT 4 - TELEMETRIA -->
            <!-- ================================================= -->

            <a-entity
                class="hotspot"
                data-topic="telemetria"
                position="0.30 -0.18 0"
                geometry="
                    primitive: circle;
                    radius: 0.055;
                "
                material="
                    color: #00ff88;
                    shader: flat;
                    opacity: 0.95;
                "
            >

                <a-text
                    value="4"
                    align="center"
                    color="#ffffff"
                    width="1"
                    position="0 0 0.01"
                ></a-text>

            </a-entity>


        </a-entity>

    </a-scene>


    <!-- Instrução inicial -->
    <div id="instruction">

        <span>
            Aponte a câmera para o Centro de Usinagem
        </span>

    </div>


    <!-- JavaScript do projeto -->
    <script src="js/app.js"></script>

</body>

</html>
```
