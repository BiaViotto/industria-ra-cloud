services:

  # ==========================================================
  # BROKER MQTT
  # ==========================================================

  mosquitto:

    image: eclipse-mosquitto:2

    container_name: industria-mosquitto

    ports:
      - "1883:1883"

    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

    restart: unless-stopped


  # ==========================================================
  # API FLASK
  # ==========================================================

  api:

    build:
      context: ./backend

    container_name: industria-api

    ports:
      - "5000:5000"

    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883

    depends_on:
      - mosquitto

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ==========================================================
  # SIMULADOR DE TELEMETRIA
  # ==========================================================

  simulator:

    build:
      context: ./simulator

    container_name: industria-simulator

    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883

    depends_on:
      mosquitto:
        condition: service_started

      api:
        condition: service_healthy

    restart: unless-stopped